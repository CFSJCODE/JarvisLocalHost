name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-validation:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      JARVIS_COMPUTE_BACKEND: cpu
      JARVIS_SOVEREIGN_MODE: "1"
      JARVIS_RAG_MODE: strict

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: jarvis_localhost/requirements.txt

      - name: Install base dependencies
        shell: pwsh
        run: python -m pip install --requirement ./jarvis_localhost/requirements.txt

      - name: Validate repository and test suite
        shell: pwsh
        run: ./jarvis_localhost/tools/validate.ps1

      # DirectML is intentionally a local hardware/driver validation. Hosted
      # runners execute the deterministic CPU suite only.
