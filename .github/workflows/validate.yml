name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate repository
        shell: pwsh
        run: ./jarvis_localhost/tools/validate.ps1
